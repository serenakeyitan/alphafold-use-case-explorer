name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: Test HTML/CSS/JS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests
        run: |
          pytest -v tests/ || true

      - name: Validate HTML structure
        run: |
          python -c "
          from bs4 import BeautifulSoup
          import sys

          with open('index.html', 'r') as f:
              soup = BeautifulSoup(f.read(), 'html.parser')

          # Check for required elements
          errors = []

          if not soup.find('nav', class_='navbar'):
              errors.append('Missing navigation bar')

          if not soup.find('section', id='hero'):
              errors.append('Missing hero section')

          if not soup.find('section', id='timeline'):
              errors.append('Missing timeline section')

          if not soup.find('section', id='use-cases'):
              errors.append('Missing use cases section')

          if not soup.find('section', id='how-it-works'):
              errors.append('Missing how it works section')

          if not soup.find('footer'):
              errors.append('Missing footer')

          # Check for dark mode toggle
          if not soup.find(id='dark-mode-toggle'):
              errors.append('Missing dark mode toggle')

          # Check for use case cards
          cards = soup.find_all('div', class_='use-case-card')
          if len(cards) < 5:
              errors.append(f'Expected 5 use case cards, found {len(cards)}')

          if errors:
              print('HTML validation errors:')
              for error in errors:
                  print(f'  - {error}')
              sys.exit(1)
          else:
              print('HTML structure validation passed!')
          "

      - name: Validate CSS
        run: |
          python -c "
          import cssutils
          import logging

          cssutils.log.setLevel(logging.CRITICAL)

          try:
              sheet = cssutils.parseFile('style.css')
              print(f'CSS parsed successfully! Found {len(sheet.cssRules)} rules.')

              # Check for CSS custom properties
              custom_props_found = False
              for rule in sheet:
                  if rule.type == rule.STYLE_RULE:
                      if ':root' in rule.selectorText or '[data-theme=' in rule.selectorText:
                          custom_props_found = True
                          break

              if not custom_props_found:
                  print('Warning: No CSS custom properties found for theming')
              else:
                  print('CSS custom properties for theming found!')

          except Exception as e:
              print(f'CSS parsing error: {e}')
              exit(1)
          "

      - name: Check for JavaScript files
        run: |
          if [ ! -f "script.js" ]; then
            echo "Error: script.js not found"
            exit 1
          fi
          echo "JavaScript file found!"

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
